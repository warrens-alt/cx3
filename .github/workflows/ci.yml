name: ConversionX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Refresh lockfile for audit branch
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit refreshed lockfile when required
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: sync npm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Verify types, contracts, tests and production build
        run: npm run verify

      - name: Audit production dependency graph
        run: npm audit --audit-level=high
