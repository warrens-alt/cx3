name: ConversionX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      # Keep the same order and fail-fast behavior as npm run verify, while
      # exposing the failing stage even when the full job log is unavailable.
      - name: Verify TypeScript types
        run: npm run lint

      - name: Verify contracts and regression tests
        run: npm test

      - name: Verify surface inventory
        run: npm run docs:surfaces:check

      - name: Build production application
        run: npm run build

      - name: Set up Java for Firestore rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore access lifecycle in the local emulator
        run: npm run test:rules

      - name: Audit production dependency graph
        run: npm audit --audit-level=high
