name: ConversionX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      # Keep the verify chain in the same fail-fast order, but expose each
      # stage independently and retain evidence when job-log access fails.
      - name: Verify TypeScript types
        run: npm run lint

      - name: Verify contracts and regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/cx-test-output.log"

      - name: Verify surface inventory
        shell: bash
        run: |
          set -o pipefail
          npm run docs:surfaces:check 2>&1 | tee "$RUNNER_TEMP/cx-surfaces-output.log"

      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/cx-build-output.log"

      - name: Verify compiled production servers over HTTP
        shell: bash
        run: |
          set -o pipefail
          node scripts/smoke-production.mjs 2>&1 | tee "$RUNNER_TEMP/cx-runtime-output.log"

      - name: Verify Google AI Studio and Cloud Run launch modes
        run: npm run test:google-runtime

      - name: Set up Java for Firestore rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore access lifecycle in the local emulator
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee "$RUNNER_TEMP/cx-rules-output.log"

      - name: Audit production dependency graph
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/cx-audit-output.log"

      - name: Preserve verification output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cx-*-output.log
          retention-days: 7
          if-no-files-found: warn
