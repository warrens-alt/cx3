name: Phase 2 source snapshot
on:
  push:
    branches: [style/journey-contact-visuals-20260929]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for local visual checks
        run: |
          mkdir -p "$RUNNER_TEMP/phase2-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/phase2-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/phase2-source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-source
          path: ${{ runner.temp }}/phase2-source
          retention-days: 1
          if-no-files-found: error
