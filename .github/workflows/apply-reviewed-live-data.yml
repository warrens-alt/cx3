name: Apply checksum-pinned live-data repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: apply-reviewed-live-data-repair
  cancel-in-progress: false
jobs:
  apply-reviewed-source:
    if: github.event.number == 25 && github.head_ref == 'fix/live-data-truthfulness-20260929' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply the exact locally tested source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root / f'.github/cx3-reviewed-update/part{i}.b64').read_text().strip() for i in range(4))
          # Correct four transport transcription differences before the pinned digest check.
          for old, new in [('GbHnH9HUp','GbH9HUp'), ('H94YLH2xf3mQT','H94YLH6xf3mQT'), ('XISl0BeCmvY','XISl0zCmvY'), ('MrnnWprWpr0eCK','MrnnWpr0eCK')]:
              encoded = encoded.replace(old, new)
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '991a2cd1ad0d9a33203f0677224031b63e585e018420afd5e5d7f7d3e0c4f4dc', 'Reviewed payload checksum mismatch'
          manifest = json.loads(raw)
          assert manifest['baseline'] == 'eaecd8916a08597d1ae0b28f7c730ce778e07aa1'
          subprocess.run(['git','merge-base','--is-ancestor',manifest['baseline'],'HEAD'], check=True)
          approved = []
          for update in manifest['updates']:
              relative = pathlib.PurePosixPath(update['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in ['contracts','docs','package.json','scripts','server','src','tests']
              target = root / relative
              before = target.read_bytes() if target.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == update['before'], f'Concurrent change: {relative}'
              lines = before.decode('utf-8').splitlines(keepends=True) if before is not None else []
              for change in reversed(update['changes']):
                  assert 0 <= change['start'] <= change['end'] <= len(lines)
                  lines[change['start']:change['end']] = change['text'].splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == update['after'], f'Output mismatch: {relative}'
              approved.append((target, after))
          for target, content in approved:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          paths = [str(target.relative_to(root)) for target, _ in approved]
          pathlib.Path(os.environ['RUNNER_TEMP'], 'reviewed-paths.json').write_text(json.dumps(paths))
          print(f'Applied {len(paths)} checksum-verified source files. No credential or workflow payload is included in the source commit.')
          PY
      - run: npm ci --ignore-scripts --no-audit
      - name: Verify reviewed source
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/live-data-verification.log"
          node scripts/smoke-production.mjs 2>&1 | tee "$RUNNER_TEMP/live-data-http.log"
      - name: Commit tested source only to the authorised feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          actual=$(git ls-remote origin refs/heads/fix/live-data-truthfulness-20260929 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          paths = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'reviewed-paths.json').read_text())
          subprocess.run(['git','add','--',*paths], check=True)
          staged = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert set(staged) == set(paths)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: remove fabricated analytics and align scoped live-data evidence'
          git push origin HEAD:refs/heads/fix/live-data-truthfulness-20260929
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-live-data-verification
          path: |
            ${{ runner.temp }}/live-data-verification.log
            ${{ runner.temp }}/live-data-http.log
          retention-days: 3
          if-no-files-found: ignore
