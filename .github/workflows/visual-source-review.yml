name: Visual source review
on:
  push:
    branches: [style/frontend-polish-20260929]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/visual-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/visual-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/visual-source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-source
          path: ${{ runner.temp }}/visual-source
          retention-days: 1
          if-no-files-found: error
