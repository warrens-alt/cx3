name: Review transfer integrity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.number == 25 && github.head_ref == 'fix/live-data-truthfulness-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-transport
          path: .github/cx3-reviewed-update/part3.b64
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
