name: Google runtime source review
on:
  push:
    branches: [fix/google-ai-runtime-20260929]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only for local verification
        run: |
          mkdir -p "$RUNNER_TEMP/google-runtime-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/google-runtime-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/google-runtime-source/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: google-runtime-source
          path: ${{ runner.temp }}/google-runtime-source
          retention-days: 1
          if-no-files-found: error
